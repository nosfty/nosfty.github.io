<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Космические корабли с эффектами и зонами захвата</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; color: white; font-family: monospace;
  }
  #ui {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    color: white;
    user-select: none;
    z-index: 10;
    background: rgba(0,0,0,0.5);
    padding: 8px 12px;
    border-radius: 8px;
  }
  #ui label, #ui input, #ui button {
    font-size: 14px;
  }
  #ui input {
    width: 150px;
  }
  #game {
    display: block;
    background: #000;
  }
  #respawnOverlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    padding: 30px 40px;
    border-radius: 12px;
    font-size: 24px;
    color: white;
    text-align: center;
    user-select: none;
    display: none;
    z-index: 20;
  }
  #respawnOverlay .deathMsg {
    margin-bottom: 15px;
    font-weight: bold;
    font-size: 20px;
    color: #ff5555;
  }
  #miniMap {
    position: fixed;
    bottom: 15px;
    right: 15px;
    width: 200px;
    height: 200px;
    background: #111;
    border: 2px solid white;
    border-radius: 8px;
    z-index: 15;
  }
  #hitEffect {
    pointer-events: none;
    position: fixed;
    top:0; left:0; width: 100%; height: 100%;
    background: rgba(255, 0, 0, 0);
    z-index: 25;
    transition: background 0.3s ease-out;
  }
</style>
</head>
<body>

<div id="ui">
  <label>Ваш ID: <span id="myId">...</span></label>
  <button id="copyBtn">Скопировать</button><br/>
  <label>Подключиться к ID: <input type="text" id="connectId" autocomplete="off" /></label>
  <button id="connectBtn">Подключиться</button>
</div>

<div id="respawnOverlay">
  <div class="deathMsg">Ваша дружба с мудасиром окончена,<br>ваш лучший друг теперь салман</div>
  Респавн через <span id="respawnTimer">3</span>...
</div>

<div id="hitEffect"></div>

<canvas id="game"></canvas>
<canvas id="miniMap"></canvas>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const miniMap = document.getElementById('miniMap');
const miniCtx = miniMap.getContext('2d');

const myIdSpan = document.getElementById('myId');
const copyBtn = document.getElementById('copyBtn');
const connectInput = document.getElementById('connectId');
const connectBtn = document.getElementById('connectBtn');

const respawnOverlay = document.getElementById('respawnOverlay');
const respawnTimerSpan = document.getElementById('respawnTimer');
const hitEffect = document.getElementById('hitEffect');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

miniMap.width = 200;
miniMap.height = 200;

const MAP_WIDTH = 2000;
const MAP_HEIGHT = 2000;

const STAR_COUNT = 200;
let stars = [];

function generateStars() {
  stars = [];
  for(let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * MAP_WIDTH,
      y: Math.random() * MAP_HEIGHT,
      radius: Math.random() * 1.5 + 0.5,
      baseBrightness: Math.random() * 0.8 + 0.2,
      brightness: 0,
      phase: Math.random() * Math.PI * 2
    });
  }
}
generateStars();

let peer = new Peer();
let conn;

let localPlayer = null;
let remotePlayer = null;

let keysPressed = {};
let mousePos = { x: 0, y: 0 };

// Захват зоны
class CaptureZone {
  constructor(x, y, radius, id) {
    this.x = x;
    this.y = y;
    this.radius = radius;
    this.id = id;
    this.capturingPlayerId = null; // кто захватил
    this.captureProgress = 0; // от 0 до 1
    this.capturingCandidate = null; // кто сейчас в зоне
  }
  
  update(dt) {
    if(!localPlayer) return;
    if(localPlayer.dead) {
      this.capturingCandidate = null;
      this.captureProgress = Math.max(0, this.captureProgress - dt * 0.5); // сброс при смерти
      return;
    }
    // Проверяем, находится ли игрок в зоне
    const dist = Math.hypot(localPlayer.x - this.x, localPlayer.y - this.y);
    if(dist < this.radius) {
      if(this.capturingCandidate === localPlayer.id || this.capturingCandidate === null) {
        this.capturingCandidate = localPlayer.id;
        if(this.capturingPlayerId !== localPlayer.id) {
          this.captureProgress += dt * 0.5; // захват за 2 секунды
          if(this.captureProgress >= 1) {
            this.captureProgress = 1;
            this.capturingPlayerId = localPlayer.id;
          }
        }
      } else {
        // другой игрок - сбрасываем
        this.captureProgress = Math.max(0, this.captureProgress - dt * 0.5);
      }
    } else {
      if(this.capturingCandidate === localPlayer.id) this.capturingCandidate = null;
      this.captureProgress = Math.max(0, this.captureProgress - dt * 0.5);
    }
  }
  
  draw(ctx, camera) {
    // Зона полупрозрачная, цвет в зависимости от захвата
    ctx.save();
    ctx.globalAlpha = 0.2 + 0.4 * this.captureProgress;
    if(this.capturingPlayerId === localPlayer?.id) {
      ctx.fillStyle = 'cyan';
    } else if(this.capturingPlayerId === remotePlayer?.id) {
      ctx.fillStyle = 'orange';
    } else {
      ctx.fillStyle = 'gray';
    }
    ctx.beginPath();
    ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Прогресс захвата полоской
    if(this.captureProgress > 0 && this.capturingPlayerId !== localPlayer?.id) {
      const barWidth = 80;
      const barHeight = 6;
      ctx.fillStyle = 'white';
      ctx.fillRect(this.x - camera.x - barWidth/2, this.y - camera.y + this.radius + 10, barWidth, barHeight);
      ctx.fillStyle = 'lime';
      ctx.fillRect(this.x - camera.x - barWidth/2, this.y - camera.y + this.radius + 10, barWidth * this.captureProgress, barHeight);
      ctx.strokeStyle = 'black';
      ctx.strokeRect(this.x - camera.x - barWidth/2, this.y - camera.y + this.radius + 10, barWidth, barHeight);
    }
    ctx.restore();
  }
  
  serialize() {
    return {
      id: this.id,
      capturingPlayerId: this.capturingPlayerId,
      captureProgress: this.captureProgress
    };
  }
  
  deserialize(data) {
    this.capturingPlayerId = data.capturingPlayerId;
    this.captureProgress = data.captureProgress;
  }
}

const captureZones = [
  new CaptureZone(500, 500, 120, 'zone1'),
  new CaptureZone(1500, 500, 120, 'zone2'),
  new CaptureZone(1000, 1500, 120, 'zone3'),
];

class Player {
  constructor(id, color) {
    this.id = id;
    this.color = color;
    this.x = Math.random() * MAP_WIDTH;
    this.y = Math.random() * MAP_HEIGHT;
    this.angle = 0;
    this.radius = 20;
    this.bullets = [];
    this.maxHealth = 100;
    this.health = this.maxHealth;
    this.dead = false;
    this.respawnCooldown = 0;
  }
  
  update(dt) {
    if(this.dead) {
      this.respawnCooldown -= dt;
      if(this === localPlayer) {
        updateRespawnOverlay(this.respawnCooldown);
      }
      if(this.respawnCooldown <= 0) {
        this.respawn();
      }
      return;
    }
    
    let moveX = 0, moveY = 0;
    if(keysPressed['w']) moveY -= 1;
    if(keysPressed['s']) moveY += 1;
    if(keysPressed['a']) moveX -= 1;
    if(keysPressed['d']) moveX += 1;
    
    let len = Math.hypot(moveX, moveY);
    if(len > 0) {
      moveX /= len;
      moveY /= len;
    }
    
    const MOVE_SPEED = 300;
    this.x += moveX * MOVE_SPEED * dt;
    this.y += moveY * MOVE_SPEED * dt;
    
    this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));
    
    if(localPlayer === this) {
      const dx = mousePos.x + camera.x - this.x;
      const dy = mousePos.y + camera.y - this.y;
      this.angle = Math.atan2(dy, dx);
    }
    
    this.bullets.forEach(b => b.update(dt));
    this.bullets = this.bullets.filter(b => !b.destroyed);
  }
  
  draw(ctx, camera) {
    ctx.save();
    ctx.translate(this.x - camera.x, this.y - camera.y);
    ctx.rotate(this.angle);
    
    if(this.dead) {
      ctx.globalAlpha = 0.4;
    }
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-15, 12);
    ctx.lineTo(-15, -12);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    
    this.bullets.forEach(b => b.draw(ctx, camera));
    
    // Полоса здоровья
    const healthBarWidth = 40;
    const healthBarHeight = 6;
    const x = this.x - camera.x - healthBarWidth / 2;
    const y = this.y - camera.y - this.radius - 15;
    
    ctx.fillStyle = 'gray';
    ctx.fillRect(x, y, healthBarWidth, healthBarHeight);
    ctx.fillStyle = 'lime';
    ctx.fillRect(x, y, healthBarWidth * (this.health / this.maxHealth), healthBarHeight);
    ctx.strokeStyle = 'black';
    ctx.strokeRect(x, y, healthBarWidth, healthBarHeight);
  }
  
  shoot() {
    if(this.dead) return;
    const speed = 600;
    const bulletX = this.x + Math.cos(this.angle) * 25;
    const bulletY = this.y + Math.sin(this.angle) * 25;
    const bullet = new Bullet(bulletX, bulletY, this.angle, speed, this.color, this.id);
    this.bullets.push(bullet);
  }
  
  takeDamage(amount) {
    if(this.dead) return;
    this.health -= amount;
    if(this === localPlayer) showHitEffect();
    if(this.health <= 0) {
      this.health = 0;
      this.dead = true;
      this.respawnCooldown = 3;
      if(this === localPlayer) {
        showRespawnOverlay();
      }
    }
  }
  
  respawn() {
    this.x = Math.random() * (MAP_WIDTH - 2 * this.radius) + this.radius;
    this.y = Math.random() * (MAP_HEIGHT - 2 * this.radius) + this.radius;
    this.health = this.maxHealth;
    this.dead = false;
    if(this === localPlayer) {
      hideRespawnOverlay();
    }
  }
}

class Bullet {
  constructor(x, y, angle, speed, color, ownerId) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.speed = speed;
    this.radius = 5;
    this.color = color;
    this.destroyed = false;
    this.ownerId = ownerId;
  }
  
  update(dt) {
    this.x += Math.cos(this.angle) * this.speed * dt;
    this.y += Math.sin(this.angle) * this.speed * dt;
    if(this.x < 0 || this.x > MAP_WIDTH || this.y < 0 || this.y > MAP_HEIGHT) {
      this.destroyed = true;
    }
  }
  
  draw(ctx, camera) {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

let camera = { x: 0, y: 0 };
let cameraVelocity = { x: 0, y: 0 };

peer.on('open', id => {
  myIdSpan.textContent = id;
  localPlayer = new Player(id, 'cyan');
  remotePlayer = new Player(null, 'orange');
  console.log('Мой ID:', id);
});

connectBtn.onclick = () => {
  const remoteId = connectInput.value.trim();
  if(!remoteId) return alert('Введите ID для подключения');
  conn = peer.connect(remoteId);
  setupConnection();
};

peer.on('connection', connection => {
  conn = connection;
  setupConnection();
});

function setupConnection() {
  conn.on('open', () => {
    console.log('Соединение открыто');
    startGame();
  });
  conn.on('data', data => {
    if(data.type === 'state') {
      if(!remotePlayer.id) remotePlayer.id = data.id;
      remotePlayer.x = data.x;
      remotePlayer.y = data.y;
      remotePlayer.angle = data.angle;
      remotePlayer.health = data.health;
      remotePlayer.dead = data.dead;
      remotePlayer.bullets = data.bullets.map(b => new Bullet(b.x, b.y, b.angle, b.speed, remotePlayer.color, b.ownerId));
      // Захват зон
      if(data.captureZones) {
        data.captureZones.forEach(z => {
          const zone = captureZones.find(cz => cz.id === z.id);
          if(zone) zone.deserialize(z);
        });
      }
    } else if(data.type === 'shoot') {
      if(remotePlayer.id === data.id) {
        remotePlayer.shoot();
      }
    } else if(data.type === 'hit') {
      if(remotePlayer.id === data.id) {
        remotePlayer.takeDamage(data.amount);
      }
    }
  });
  conn.on('close', () => {
    alert('Соединение закрыто');
  });
}

function sendState() {
  if(conn && conn.open) {
    conn.send({
      type: 'state',
      id: localPlayer.id,
      x: localPlayer.x,
      y: localPlayer.y,
      angle: localPlayer.angle,
      health: localPlayer.health,
      dead: localPlayer.dead,
      bullets: localPlayer.bullets.map(b => ({x: b.x, y: b.y, angle: b.angle, speed: b.speed, ownerId: b.ownerId})),
      captureZones: captureZones.map(z => z.serialize())
    });
  }
}

function sendShoot() {
  if(conn && conn.open) {
    conn.send({ type: 'shoot', id: localPlayer.id });
  }
}

function sendHit(id, amount) {
  if(conn && conn.open) {
    conn.send({ type: 'hit', id, amount });
  }
}

function updateCamera(dt) {
  // Плавное движение камеры с инерцией
  const targetX = localPlayer.x - canvas.width / 2;
  const targetY = localPlayer.y - canvas.height / 2;
  
  const smoothFactor = 0.1;
  cameraVelocity.x += (targetX - camera.x) * smoothFactor;
  cameraVelocity.y += (targetY - camera.y) * smoothFactor;
  
  // Затухание инерции
  cameraVelocity.x *= 0.85;
  cameraVelocity.y *= 0.85;
  
  camera.x += cameraVelocity.x;
  camera.y += cameraVelocity.y;
  
  camera.x = Math.max(0, Math.min(MAP_WIDTH - canvas.width, camera.x));
  camera.y = Math.max(0, Math.min(MAP_HEIGHT - canvas.height, camera.y));
}

let lastTime = 0;
let hitEffectTimeout = null;

function gameLoop(timestamp) {
  if(!lastTime) lastTime = timestamp;
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  
  // Мерцание звезд
  stars.forEach(s => {
    s.brightness = s.baseBrightness + Math.sin(timestamp / 300 + s.phase) * 0.15;
    s.brightness = Math.min(Math.max(s.brightness, 0), 1);
  });
  
  localPlayer.update(dt);
  remotePlayer.update(dt);
  
  captureZones.forEach(z => z.update(dt));
  
  updateCamera(dt);
  
  checkHits(localPlayer, remotePlayer);
  checkHits(remotePlayer, localPlayer);
  
  sendState();
  
  draw();
  drawMiniMap();
  requestAnimationFrame(gameLoop);
}

function checkHits(shooter, target) {
  if(shooter.dead) return;
  shooter.bullets.forEach(bullet => {
    if(bullet.destroyed) return;
    const dx = bullet.x - target.x;
    const dy = bullet.y - target.y;
    const dist = Math.hypot(dx, dy);
    if(dist < bullet.radius + target.radius && !target.dead) {
      bullet.destroyed = true;
      if(target === localPlayer) {
        localPlayer.takeDamage(20);
        sendHit(localPlayer.id, 20);
      } else {
        target.takeDamage(20);
      }
    }
  });
}

function drawStars() {
  ctx.fillStyle = 'white';
  stars.forEach(s => {
    ctx.globalAlpha = s.brightness;
    ctx.beginPath();
    ctx.arc(s.x - camera.x, s.y - camera.y, s.radius, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStars();
  
  // Рисуем зоны захвата
  captureZones.forEach(z => z.draw(ctx, camera));
  
  localPlayer.draw(ctx, camera);
  remotePlayer.draw(ctx, camera);
}

function drawMiniMap() {
  const scaleX = miniMap.width / MAP_WIDTH;
  const scaleY = miniMap.height / MAP_HEIGHT;
  
  miniCtx.fillStyle = '#000';
  miniCtx.fillRect(0, 0, miniMap.width, miniMap.height);
  
  // Звезды на миникарте
  miniCtx.fillStyle = 'white';
  stars.forEach(s => {
    miniCtx.globalAlpha = s.brightness;
    miniCtx.beginPath();
    miniCtx.arc(s.x * scaleX, s.y * scaleY, s.radius * 0.5, 0, Math.PI * 2);
    miniCtx.fill();
  });
  miniCtx.globalAlpha = 1;
  
  // Игроки на миникарте
  function drawShip(x, y, color) {
    miniCtx.fillStyle = color;
    miniCtx.beginPath();
    miniCtx.moveTo(x + 10, y);
    miniCtx.lineTo(x - 7, y + 7);
    miniCtx.lineTo(x - 7, y - 7);
    miniCtx.closePath();
    miniCtx.fill();
  }
  
  if(localPlayer) {
    drawShip(localPlayer.x * scaleX, localPlayer.y * scaleY, 'cyan');
  }
  if(remotePlayer && remotePlayer.id) {
    drawShip(remotePlayer.x * scaleX, remotePlayer.y * scaleY, 'orange');
  }
  
  // Обзор камеры — прямоугольник
  miniCtx.strokeStyle = 'lime';
  miniCtx.lineWidth = 2;
  miniCtx.strokeRect(camera.x * scaleX, camera.y * scaleY, canvas.width * scaleX, canvas.height * scaleY);
}

// Управление мышью и клавишами

document.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mousePos.x = e.clientX - rect.left;
  mousePos.y = e.clientY - rect.top;
});

document.addEventListener('keydown', e => {
  keysPressed[e.key.toLowerCase()] = true;
  if(e.key === ' ') {
    localPlayer.shoot();
    sendShoot();
  }
});

document.addEventListener('keyup', e => {
  keysPressed[e.key.toLowerCase()] = false;
});

copyBtn.onclick = () => {
  if(!myIdSpan.textContent || myIdSpan.textContent === '...') return;
  navigator.clipboard.writeText(myIdSpan.textContent).then(() => {
    copyBtn.textContent = 'Скопировано!';
    setTimeout(() => copyBtn.textContent = 'Скопировать', 1500);
  }).catch(() => alert('Не удалось скопировать'));
};

// Респавн оверлей

function showRespawnOverlay() {
  respawnOverlay.style.display = 'block';
}

function hideRespawnOverlay() {
  respawnOverlay.style.display = 'none';
}

function updateRespawnOverlay(timeLeft) {
  const sec = Math.ceil(timeLeft);
  respawnTimerSpan.textContent = sec > 0 ? sec : 0;
}

// Эффект попадания
function showHitEffect() {
  hitEffect.style.background = 'rgba(255,0,0,0.3)';
  if(hitEffectTimeout) clearTimeout(hitEffectTimeout);
  hitEffectTimeout = setTimeout(() => {
    hitEffect.style.background = 'rgba(255,0,0,0)';
  }, 200);
}

function startGame() {
  requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
