<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Heart Burst Tete</title>
  <style>
    body {
      margin: 0;
      background: #f0f0f0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      overflow: hidden;
    }
    #container { position: relative; text-align: center; }
    #avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 15px;
      display: none;
      border: 3px solid #5865F2;
    }
    #img {
      height: 400px;
      transition: transform 0.25s ease;
      cursor: pointer;
      display: block;
      margin: auto;
    }
    .squash { transform: scaleY(0.2); }
    .heart {
      position: absolute;
      font-size: 32px;
      color: red;
      opacity: 1;
      animation: fly 1s ease-out forwards;
      pointer-events: none;
    }
    @keyframes fly {
      0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(0.6); opacity: 0; }
    }
    #counter {
      font-size: 22px;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-Dxs2gViQ.js"></script>
</head>
<body>
  <div id="container">
    <img id="avatar" src="" alt="User Avatar" />
    <div id="userInfo"></div>
    <img id="img" src="https://ih1.redbubble.net/image.5018714309.4771/flat,750x,075,f-pad,750x1000,f8f8f8.jpg" alt="teto" />
    <div id="counter">❤️ 0</div>
  </div>

</body>
</html>
