<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Heart Burst Tetе</title>
<style>
    body {
        margin: 0;
        background: #f0f0f0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        overflow: hidden; /* чтобы сердечки не создавали скролл */
    }

    #container {
        position: relative;
    }

    #img {
        height: 400px;
        transition: transform 0.25s ease;
        cursor: pointer;
        display: block;
    }

    .squash {
        transform: scaleY(0.2);
    }

    /* анимация сердечка */
    .heart {
        position: absolute;
        font-size: 32px;
        color: red;
        opacity: 1;
        animation: fly 1s ease-out forwards;
        pointer-events: none;
    }

    @keyframes fly {
        0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -120px) scale(0.6); opacity: 0; }
    }
</style>
</head>
<body>

<div id="container">
    <img id="img"
         src="https://ih1.redbubble.net/image.5018714309.4771/flat,750x,075,f-pad,750x1000,f8f8f8.jpg"
         alt="teto">
</div>

<script>
    const img = document.getElementById("img");
    const container = document.getElementById("container");

    img.addEventListener("click", () => {

        /* --- Анимация тето --- */
        img.classList.add("squash");
        setTimeout(() => img.classList.remove("squash"), 250);

        /* --- Сердечки ❤️ --- */
        const heart = document.createElement("div");
        heart.textContent = "❤️";
        heart.className = "heart";

        // случайная позиция появления (от -80 до +80 px)
        const randX = (Math.random() * 160) - 80;
        const randY = (Math.random() * 160) - 80;

        heart.style.left = `calc(50% + ${randX}px)`;
        heart.style.top = `calc(50% + ${randY}px)`;

        container.appendChild(heart);

        setTimeout(() => heart.remove(), 1000);
    });
</script>

</body>
</html>
