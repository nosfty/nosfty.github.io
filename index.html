<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Heart Burst Tete</title>

<script type="module">
    import { DiscordSDK } from "https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk/dist/discord-sdk.mjs";

    const discordSdk = new DiscordSDK("YOUR_CLIENT_ID");

    await discordSdk.ready();
</script>
<style>
    body {
        margin: 0;
        background: #f0f0f0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        overflow: hidden;
    }

    #container { 
        position: relative; 
        text-align: center; 
    }

    #avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin-bottom: 15px;
        display: none;
        border: 3px solid #5865F2;
    }

    #img {
        height: 400px;
        transition: transform 0.25s ease;
        cursor: pointer;
        display: block;
        margin: auto;
    }

    .squash { transform: scaleY(0.2); }

    .heart {
        position: absolute;
        font-size: 32px;
        color: red;
        opacity: 1;
        animation: fly 1s ease-out forwards;
        pointer-events: none;
    }

    @keyframes fly {
        0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -120px) scale(0.6); opacity: 0; }
    }

    #counter { 
        font-size: 22px; 
        margin-top: 10px;
        font-weight: bold; 
    }
</style>
</head>
<body>

<div id="container">

    <img id="avatar" src="">
    <div id="userInfo"></div>

    <img id="img" src="https://ih1.redbubble.net/image.5018714309.4771/flat,750x,075,f-pad,750x1000,f8f8f8.jpg" alt="teto">
    <div id="counter">❤️ 0</div>
</div>


<script>
/* ------------------------- Discord Activities Auth ------------------------- */

const discordSdk = new window.DiscordSDK();

async function initDiscord() {
    await discordSdk.ready();

    // запрос разрешений у Discord
    const { user } = await discordSdk.commands.authenticate();

    console.log("User:", user);

    document.getElementById("userInfo").textContent = `Вы вошли как: ${user.username}`;

    const avatarImg = document.getElementById("avatar");
    avatarImg.src =
        user.avatar
            ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
            : "https://cdn.discordapp.com/embed/avatars/0.png";
    avatarImg.style.display = "block";

    localStorage.setItem("tete_user_id", user.id);

    loadCounter();
}

initDiscord();


/* ------------------------------- Счётчик ------------------------------- */
const counterEl = document.getElementById("counter");
let counter = 0;

function loadCounter() {
    const user = localStorage.getItem("tete_user_id") || "guest";
    counter = Number(localStorage.getItem(`tete_counter_${user}`) || 0);
    counterEl.textContent = `❤️ ${counter}`;
}

function saveCounter() {
    const user = localStorage.getItem("tete_user_id") || "guest";
    localStorage.setItem(`tete_counter_${user}`, counter);
}


/* ----------------------------- Клики + сердечки ----------------------------- */
const img = document.getElementById("img");
const container = document.getElementById("container");

img.addEventListener("click", () => {

    counter++;
    counterEl.textContent = `❤️ ${counter}`;
    saveCounter();

    img.classList.add("squash");
    setTimeout(() => img.classList.remove("squash"), 250);

    const heart = document.createElement("div");
    heart.textContent = "❤️";
    heart.className = "heart";

    const randX = (Math.random() * 160) - 80;
    const randY = (Math.random() * 160) - 80;

    heart.style.left = `calc(50% + ${randX}px)`;
    heart.style.top = `calc(50% + ${randY}px)`;

    container.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
});
</script>

</body>
</html>
