<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Heart Burst Teto — Deluxe</title>
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #ff9bd4, #b19bff);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    #panel {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255,255,255,0.25);
        backdrop-filter: blur(12px);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        color: #fff;
        max-width: 260px;
    }

    #avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid white;
        object-fit: cover;
        display: none;
        margin-bottom: 10px;
    }

    #settings input {
        width: 60px;
        text-align: center;
        border-radius: 6px;
        border: none;
        padding: 4px;
    }

    #container { text-align: center; position: relative; }

    #img {
        height: 420px;
        transition: transform 0.25s ease;
        cursor: pointer;
        filter: drop-shadow(0 0 25px rgba(255,255,255,0.6));
    }

    .squash { transform: scale(1.05) rotate(2deg); }

    .heart {
        position: absolute;
        font-size: 32px;
        opacity: 1;
        animation: fly 1s ease-out forwards;
        pointer-events: none;
        filter: drop-shadow(0 0 10px red);
    }

    @keyframes fly {
        0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -140px) scale(0.6); opacity: 0; }
    }

    #counter {
        font-size: 26px;
        font-weight: bold;
        color: white;
        text-shadow: 0 0 10px black;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div id="panel">
    <img id="avatar">
    <div id="userInfo">Не авторизован</div>
    <br>
    <button id="loginBtn">Войти через Discord</button>
    <hr style="opacity:0.3; margin: 15px 0;">
    <h3>Настройки кликов</h3>
    <div id="settings">
        Разброс X: <input id="rangeX" type="number" value="120"><br><br>
        Разброс Y: <input id="rangeY" type="number" value="120"><br><br>
        Размер ❤️: <input id="sizeH" type="number" value="32">
    </div>
</div>

<div id="container">
    <img id="img" src="https://ih1.redbubble.net/image.5018714309.4771/flat,750x,075,f-pad,750x1000,f8f8f8.jpg" alt="teto">
    <div id="counter">❤️ 0</div>
</div>

<script>
/* ---------------- Discord OAuth ---------------- */
const CLIENT_ID = "1441197732948869290";
const REDIRECT_URI = "https://nosfty.github.io/";

const avatarImg = document.getElementById("avatar");

loginBtn.onclick = () => {
    const url = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
    window.location.href = url;
};

window.addEventListener("load", async () => {
    if (location.hash.includes("access_token")) {
        const params = new URLSearchParams(location.hash.substring(1));
        const token = params.get("access_token");

        const user = await fetch("https://discord.com/api/users/@me", {
            headers: { Authorization: `Bearer ${token}` }
        }).then(r => r.json());

        userInfo.textContent = `${user.username}`;
        avatarImg.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`;
        avatarImg.style.display = "block";

        localStorage.setItem("tete_user_id", user.id);
        loadCounter();
    } else loadCounter();
});

/* ---------------- Счётчик ---------------- */
let counter = 0;
function loadCounter() {
    const user = localStorage.getItem("tete_user_id") || "guest";
    counter = +localStorage.getItem(`tete_counter_${user}`) || 0;
    counterEl.textContent = `❤️ ${counter}`;
}

function saveCounter() {
    const user = localStorage.getItem("tete_user_id") || "guest";
    localStorage.setItem(`tete_counter_${user}`, counter);
}

/* ---------------- Сердечки ---------------- */
img.addEventListener("click", () => {
    counter++;
    counterEl.textContent = `❤️ ${counter}`;
    saveCounter();

    img.classList.add("squash");
    setTimeout(() => img.classList.remove("squash"), 250);

    const heart = document.createElement("div");
    heart.textContent = "❤️";
    heart.className = "heart";

    const rx = +rangeX.value;
    const ry = +rangeY.value;
    const size = +sizeH.value;

    heart.style.fontSize = size + "px";
    heart.style.left = `calc(50% + ${(Math.random() * rx * 2) - rx}px)`;
    heart.style.top = `calc(50% + ${(Math.random() * ry * 2) - ry}px)`;

    container.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
});
</script>

</body>
</html>
