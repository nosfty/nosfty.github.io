<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Космические корабли с эффектами и зонами захвата</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; color: white; font-family: monospace;
  }
  #ui {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    padding: 25px 40px;
    border-radius: 12px;
    box-shadow: 0 0 20px cyan;
    width: 320px;
    user-select: none;
    z-index: 10;
  }
  #ui h1 {
    margin: 0 0 20px 0;
    font-size: 24px;
    text-align: center;
    color: cyan;
  }
  #ui label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
  }
  #myRoomCode {
    font-weight: bold;
    font-size: 20px;
    color: lime;
    margin-bottom: 10px;
    user-select: all;
    cursor: pointer;
  }
  #connectId {
    width: 100%;
    padding: 8px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    margin-bottom: 15px;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    background: cyan;
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  button:hover {
    background: #00b3b3;
  }
  #statusMsg {
    margin-top: 15px;
    font-size: 14px;
    text-align: center;
    color: yellow;
    min-height: 18px;
  }
  #respawnOverlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    padding: 30px 40px;
    border-radius: 12px;
    font-size: 24px;
    color: white;
    text-align: center;
    user-select: none;
    display: none;
    z-index: 20;
  }
  #respawnOverlay .deathMsg {
    margin-bottom: 15px;
    font-weight: bold;
    font-size: 20px;
    color: #ff5555;
  }
  #miniMap {
    position: fixed;
    bottom: 15px;
    right: 15px;
    width: 200px;
    height: 200px;
    background: #111;
    border: 2px solid white;
    border-radius: 8px;
    z-index: 15;
  }
  #hitEffect {
    pointer-events: none;
    position: fixed;
    top:0; left:0; width: 100%; height: 100%;
    background: rgba(255, 0, 0, 0);
    z-index: 25;
    transition: background 0.3s ease-out;
  }
  canvas#game {
    display: block;
    background: #000;
  }
</style>
</head>
<body>

<div id="ui">
  <h1>Космические корабли</h1>
  <label>Ваш румкод (комната):</label>
  <div id="myRoomCode" title="Нажмите, чтобы скопировать"></div>
  <button id="copyBtn">Скопировать румкод</button>
  
  <hr style="margin:20px 0; border-color: #444;">
  
  <label for="connectId">Подключиться к румкоду друга:</label>
  <input type="text" id="connectId" maxlength="4" placeholder="Введите 4 цифры" autocomplete="off" />
  <button id="connectBtn">Подключиться</button>
  
  <div id="statusMsg"></div>
  
  <div style="margin-top: 15px; font-size: 12px; color: #555; text-align: center;">
    Версия: 1.0.0
  </div>
</div>

<div id="respawnOverlay">
  <div class="deathMsg">Ваша дружба с мудасиром окончена,<br>ваш лучший друг теперь салман</div>
  Респавн через <span id="respawnTimer">3</span>...
</div>

<div id="hitEffect"></div>

<canvas id="game"></canvas>
<canvas id="miniMap"></canvas>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const miniMap = document.getElementById('miniMap');
const miniCtx = miniMap.getContext('2d');

const myRoomCodeDiv = document.getElementById('myRoomCode');
const copyBtn = document.getElementById('copyBtn');
const connectInput = document.getElementById('connectId');
const connectBtn = document.getElementById('connectBtn');
const statusMsg = document.getElementById('statusMsg');

const respawnOverlay = document.getElementById('respawnOverlay');
const respawnTimerSpan = document.getElementById('respawnTimer');
const hitEffect = document.getElementById('hitEffect');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

miniMap.width = 200;
miniMap.height = 200;

const MAP_WIDTH = 2000;
const MAP_HEIGHT = 2000;

const STAR_COUNT = 200;
let stars = [];

function generateStars() {
  stars = [];
  for(let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * MAP_WIDTH,
      y: Math.random() * MAP_HEIGHT,
      radius: Math.random() * 1.5 + 0.5,
      baseBrightness: Math.random() * 0.8 + 0.2,
      brightness: 0,
      phase: Math.random() * Math.PI * 2
    });
  }
}
generateStars();

// PeerJS и игроки
let peer;
let conn;

let localPlayer = null;
let remotePlayer = null;

let keysPressed = {};
let mousePos = { x: 0, y: 0 };

// --- Захват зоны (оставил без изменений) ---
class CaptureZone {
  constructor(x, y, radius, id) {
    this.x = x;
    this.y = y;
    this.radius = radius;
    this.id = id;
    this.capturingPlayerId = null;
    this.captureProgress = 0;
    this.capturingCandidate = null;
  }
  update(dt) {
    if(!localPlayer) return;
    if(localPlayer.dead) {
      this.capturingCandidate = null;
      this.captureProgress = Math.max(0, this.captureProgress - dt * 0.5);
      return;
    }
    const dist = Math.hypot(localPlayer.x - this.x, localPlayer.y - this.y);
    if(dist < this.radius) {
      if(this.capturingCandidate === localPlayer.id || this.capturingCandidate === null) {
        this.capturingCandidate = localPlayer.id;
        if(this.capturingPlayerId !== localPlayer.id) {
          this.captureProgress += dt * 0.5;
          if(this.captureProgress >= 1) {
            this.captureProgress = 1;
            this.capturingPlayerId = localPlayer.id;
          }
        }
      } else {
        this.captureProgress = Math.max(0, this.captureProgress - dt * 0.5);
      }
    } else {
      if(this.capturingCandidate === localPlayer.id) this.capturingCandidate = null;
      this.captureProgress = Math.max(0, this.captureProgress - dt * 0.5);
    }
  }
  draw(ctx, camera) {
    ctx.save();
    ctx.globalAlpha = 0.2 + 0.4 * this.captureProgress;
    if(this.capturingPlayerId === localPlayer?.id) {
      ctx.fillStyle = 'cyan';
    } else if(this.capturingPlayerId === remotePlayer?.id) {
      ctx.fillStyle = 'orange';
    } else {
      ctx.fillStyle = 'gray';
    }
    ctx.beginPath();
    ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    if(this.captureProgress > 0 && this.capturingPlayerId !== localPlayer?.id) {
      const barWidth = 80;
      const barHeight = 6;
      ctx.fillStyle = 'white';
      ctx.fillRect(this.x - camera.x - barWidth/2, this.y - camera.y + this.radius + 10, barWidth, barHeight);
      ctx.fillStyle = 'lime';
      ctx.fillRect(this.x - camera.x - barWidth/2, this.y - camera.y + this.radius + 10, barWidth * this.captureProgress, barHeight);
      ctx.strokeStyle = 'black';
      ctx.strokeRect(this.x - camera.x - barWidth/2, this.y - camera.y + this.radius + 10, barWidth, barHeight);
    }
    ctx.restore();
  }
  serialize() {
    return {
      id: this.id,
      capturingPlayerId: this.capturingPlayerId,
      captureProgress: this.captureProgress
    };
  }
  deserialize(data) {
    this.capturingPlayerId = data.capturingPlayerId;
    this.captureProgress = data.captureProgress;
  }
}

const captureZones = [
  new CaptureZone(500, 500, 120, 'zone1'),
  new CaptureZone(1500, 500, 120, 'zone2'),
  new CaptureZone(1000, 1500, 120, 'zone3'),
];

// Игрок и пули
class Player {
  constructor(id, color) {
    this.id = id;
    this.color = color;
    this.x = Math.random() * MAP_WIDTH;
    this.y = Math.random() * MAP_HEIGHT;
    this.angle = 0;
    this.radius = 20;
    this.bullets = [];
    this.maxHealth = 100;
    this.health = this.maxHealth;
    this.dead = false;
    this.respawnCooldown = 0;
  }
  update(dt) {
    if(this.dead) {
      this.respawnCooldown -= dt;
      if(this === localPlayer) {
        updateRespawnOverlay(this.respawnCooldown);
      }
      if(this.respawnCooldown <= 0) {
        this.respawn();
      }
      return;
    }
    let moveX = 0, moveY = 0;
    if(keysPressed['w']) moveY -= 1;
    if(keysPressed['s']) moveY += 1;
    if(keysPressed['a']) moveX -= 1;
    if(keysPressed['d']) moveX += 1;
    let len = Math.hypot(moveX, moveY);
    if(len > 0) {
      moveX /= len;
      moveY /= len;
    }
    const MOVE_SPEED = 300;
    this.x += moveX * MOVE_SPEED * dt;
    this.y += moveY * MOVE_SPEED * dt;
    this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));
    if(localPlayer === this) {
      const dx = mousePos.x + camera.x - this.x;
      const dy = mousePos.y + camera.y - this.y;
      this.angle = Math.atan2(dy, dx);
    }
    this.bullets.forEach(b => b.update(dt));
    this.bullets = this.bullets.filter(b => !b.destroyed);
  }
  draw(ctx, camera) {
    ctx.save();
    ctx.translate(this.x - camera.x, this.y - camera.y);
    ctx.rotate(this.angle);
    if(this.dead) {
      ctx.globalAlpha = 0.4;
    }
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-15, 12);
    ctx.lineTo(-15, -12);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    this.bullets.forEach(b => b.draw(ctx, camera));
    const healthBarWidth = 40;
    const healthBarHeight = 6;
    const x = this.x - camera.x - healthBarWidth / 2;
    const y = this.y - camera.y - this.radius - 15;
    ctx.fillStyle = 'gray';
    ctx.fillRect(x, y, healthBarWidth, healthBarHeight);
    ctx.fillStyle = 'lime';
    ctx.fillRect(x, y, healthBarWidth * (this.health / this.maxHealth), healthBarHeight);
    ctx.strokeStyle = 'black';
    ctx.strokeRect(x, y, healthBarWidth, healthBarHeight);
  }
  shoot() {
    if(this.dead) return;
    const speed = 600;
    const bulletX = this.x + Math.cos(this.angle) * 25;
    const bulletY = this.y + Math.sin(this.angle) * 25;
    const bullet = new Bullet(bulletX, bulletY, this.angle, speed, this.color, this.id);
    this.bullets.push(bullet);
  }
  takeDamage(amount) {
    if(this.dead) return;
    this.health -= amount;
    if(this === localPlayer) showHitEffect();
    if(this.health <= 0) {
      this.health = 0;
      this.dead = true;
      this.respawnCooldown = 3;
      if(this === localPlayer) {
        showRespawnOverlay();
      }
    }
  }
  respawn() {
    this.x = Math.random() * (MAP_WIDTH - 2 * this.radius) + this.radius;
    this.y = Math.random() * (MAP_HEIGHT - 2 * this.radius) + this.radius;
    this.health = this.maxHealth;
    this.dead = false;
    if(this === localPlayer) {
      hideRespawnOverlay();
    }
  }
}

class Bullet {
  constructor(x, y, angle, speed, color, ownerId) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.speed = speed;
    this.radius = 5;
    this.color = color;
    this.destroyed = false;
    this.ownerId = ownerId;
  }
  update(dt) {
    this.x += Math.cos(this.angle) * this.speed * dt;
    this.y += Math.sin(this.angle) * this.speed * dt;
    if(this.x < 0 || this.x > MAP_WIDTH || this.y < 0 || this.y > MAP_HEIGHT) {
      this.destroyed = true;
    }
  }
  draw(ctx, camera) {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

let camera = { x: 0, y: 0 };
let cameraVelocity = { x: 0, y: 0 };

// --------- Новый код: генерация и работа с 4-значным румкодом -----------

function generateRoomCode() {
  return Math.floor(1000 + Math.random() * 9000).toString();
}

function isValidRoomCode(code) {
  return /^\d{4}$/.test(code);
}

let myRoomCode = generateRoomCode();
myRoomCodeDiv.textContent = myRoomCode;

copyBtn.onclick = () => {
  navigator.clipboard.writeText(myRoomCode).then(() => {
    alert('Румкод скопирован в буфер обмена!');
  });
};

connectBtn.onclick = () => {
  const remoteCode = connectInput.value.trim();
  if(!isValidRoomCode(remoteCode)) {
    statusMsg.textContent = "Введите корректный 4-значный румкод!";
    return;
  }
  if(remoteCode === myRoomCode) {
    statusMsg.textContent = "Нельзя подключаться к своему румкоду!";
    return;
  }
  statusMsg.textContent = "Подключение...";
  connectToPeer(remoteCode);
};

// Создаем Peer с нашим румкодом
function createPeer() {
  peer = new Peer(myRoomCode, {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        {
          urls: 'turn:turn.anyfirewall.com:443?transport=tcp',
          username: 'webrtc',
          credential: 'webrtc'
        }
      ]
    }
  });

  peer.on('open', id => {
    console.log('Peer открыт с ID:', id);
    localPlayer = new Player(id, 'cyan');
    remotePlayer = new Player(null, 'orange');
  });

  peer.on('connection', connection => {
    if(conn) {
      // уже есть подключение, отвергаем новые
      connection.close();
      return;
    }
    conn = connection;
    setupConnection();
  });

  peer.on('error', err => {
    console.error('Peer error:', err);
    statusMsg.textContent = 'Ошибка Peer: ' + err;
  });
}

// Подключаемся к другому пиру
function connectToPeer(remoteId) {
  if(conn) {
    conn.close();
    conn = null;
  }
  if(!peer || peer.disconnected) {
    statusMsg.textContent = 'Peer не готов. Перезагрузите страницу.';
    return;
  }
  conn = peer.connect(remoteId);
  setupConnection();
}

function setupConnection() {
  conn.on('open', () => {
    console.log('Соединение открыто');
    statusMsg.textContent = 'Соединение установлено!';
    document.getElementById('ui').style.display = 'none'; // <-- Скрываем меню после подключения
  });

  conn.on('data', data => {
    // Обработка данных
    handleData(data);
  });

  conn.on('close', () => {
    console.log('Соединение закрыто');
    statusMsg.textContent = 'Соединение закрыто.';
    document.getElementById('ui').style.display = 'block'; // Показываем меню снова
    conn = null;
  });

  conn.on('error', err => {
    console.error('Ошибка соединения:', err);
    statusMsg.textContent = 'Ошибка соединения: ' + err;
  });
}

// Отправляем данные (игрока, пули, зоны захвата)
function sendData() {
  if(conn && conn.open && localPlayer) {
    const data = {
      player: {
        x: localPlayer.x,
        y: localPlayer.y,
        angle: localPlayer.angle,
        health: localPlayer.health,
        dead: localPlayer.dead,
        id: localPlayer.id
      },
      bullets: localPlayer.bullets.map(b => ({
        x: b.x,
        y: b.y,
        angle: b.angle,
        ownerId: b.ownerId
      })),
      captureZones: captureZones.map(z => z.serialize())
    };
    conn.send(data);
  }
}

// Получаем данные от удаленного игрока
function handleData(data) {
  if(!remotePlayer) return;
  if(data.player) {
    remotePlayer.id = data.player.id;
    remotePlayer.x = data.player.x;
    remotePlayer.y = data.player.y;
    remotePlayer.angle = data.player.angle;
    remotePlayer.health = data.player.health;
    remotePlayer.dead = data.player.dead;
  }
  if(data.bullets) {
    remotePlayer.bullets = data.bullets.map(b => {
      const bullet = new Bullet(b.x, b.y, b.angle, 600, 'orange', b.ownerId);
      return bullet;
    });
  }
  if(data.captureZones) {
    data.captureZones.forEach(zData => {
      const zone = captureZones.find(z => z.id === zData.id);
      if(zone) zone.deserialize(zData);
    });
  }
}

// -------------------- Игровой цикл ---------------------

let lastTime = 0;

function update(time = 0) {
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  if(localPlayer) localPlayer.update(dt);
  if(remotePlayer) remotePlayer.update(dt);

  captureZones.forEach(z => z.update(dt));

  if(localPlayer && remotePlayer) {
    // Проверка попаданий пуль в игроков
    localPlayer.bullets.forEach(b => {
      if(!b.destroyed && !remotePlayer.dead) {
        const dist = Math.hypot(b.x - remotePlayer.x, b.y - remotePlayer.y);
        if(dist < remotePlayer.radius + b.radius) {
          b.destroyed = true;
          remotePlayer.takeDamage(20);
        }
      }
    });
    remotePlayer.bullets.forEach(b => {
      if(!b.destroyed && !localPlayer.dead) {
        const dist = Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y);
        if(dist < localPlayer.radius + b.radius) {
          b.destroyed = true;
          localPlayer.takeDamage(20);
        }
      }
    });
  }

  // Камера плавно следует за локальным игроком
  if(localPlayer) {
    const targetX = localPlayer.x - canvas.width / 2;
    const targetY = localPlayer.y - canvas.height / 2;
    camera.x += (targetX - camera.x) * 0.1;
    camera.y += (targetY - camera.y) * 0.1;
  }

  sendData();
  draw();

  requestAnimationFrame(update);
}

// ----------------- Отрисовка --------------------------

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Звезды с мерцанием
  const time = Date.now() / 1000;
  stars.forEach(star => {
    star.brightness = star.baseBrightness + Math.sin(time * 3 + star.phase) * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${star.brightness.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(star.x - camera.x, star.y - camera.y, star.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  // Зоны захвата
  captureZones.forEach(zone => zone.draw(ctx, camera));

  if(remotePlayer) remotePlayer.draw(ctx, camera);
  if(localPlayer) localPlayer.draw(ctx, camera);

  // Миникарта
  drawMiniMap();
}

function drawMiniMap() {
  miniCtx.clearRect(0, 0, miniMap.width, miniMap.height);
  // Звезды на миникарте
  stars.forEach(star => {
    miniCtx.fillStyle = 'white';
    miniCtx.beginPath();
    miniCtx.arc((star.x / MAP_WIDTH) * miniMap.width, (star.y / MAP_HEIGHT) * miniMap.height, 1, 0, Math.PI * 2);
    miniCtx.fill();
  });
  // Зоны захвата
  captureZones.forEach(zone => {
    miniCtx.fillStyle = (zone.capturingPlayerId === localPlayer?.id) ? 'cyan' :
                        (zone.capturingPlayerId === remotePlayer?.id) ? 'orange' : 'gray';
    miniCtx.globalAlpha = 0.5 + 0.5 * zone.captureProgress;
    miniCtx.beginPath();
    miniCtx.arc((zone.x / MAP_WIDTH) * miniMap.width, (zone.y / MAP_HEIGHT) * miniMap.height, zone.radius / 10, 0, Math.PI * 2);
    miniCtx.fill();
    miniCtx.globalAlpha = 1;
  });

  if(localPlayer) {
    miniCtx.fillStyle = 'cyan';
    miniCtx.beginPath();
    miniCtx.arc((localPlayer.x / MAP_WIDTH) * miniMap.width, (localPlayer.y / MAP_HEIGHT) * miniMap.height, 5, 0, Math.PI * 2);
    miniCtx.fill();
  }
  if(remotePlayer) {
    miniCtx.fillStyle = 'orange';
    miniCtx.beginPath();
    miniCtx.arc((remotePlayer.x / MAP_WIDTH) * miniMap.width, (remotePlayer.y / MAP_HEIGHT) * miniMap.height, 5, 0, Math.PI * 2);
    miniCtx.fill();
  }
}

// ------------- События клавиатуры и мыши -------------

window.addEventListener('keydown', e => {
  keysPressed[e.key.toLowerCase()] = true;
  if(e.key === ' ') {
    if(localPlayer && !localPlayer.dead) {
      localPlayer.shoot();
    }
  }
});

window.addEventListener('keyup', e => {
  keysPressed[e.key.toLowerCase()] = false;
});

window.addEventListener('mousemove', e => {
  mousePos.x = e.clientX;
  mousePos.y = e.clientY;
});

// ------------- Эффекты ------------------

function showHitEffect() {
  hitEffect.style.background = 'rgba(255,0,0,0.3)';
  setTimeout(() => {
    hitEffect.style.background = 'rgba(255,0,0,0)';
  }, 100);
}

function showRespawnOverlay() {
  respawnOverlay.style.display = 'block';
  respawnTimerSpan.textContent = '3';
}

function updateRespawnOverlay(timeLeft) {
  if(timeLeft > 0) {
    respawnTimerSpan.textContent = Math.ceil(timeLeft).toString();
  } else {
    respawnTimerSpan.textContent = '0';
  }
}

function hideRespawnOverlay() {
  respawnOverlay.style.display = 'none';
}

// ------------- Запуск -------------------

createPeer();
requestAnimationFrame(update);
</script>
</body>
</html>
