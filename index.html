<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Космические корабли с эффектами и зонами захвата</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;height:100%;background:#000;color:#fff;font-family:monospace}
#ui{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);padding:25px 40px;border-radius:12px;box-shadow:0 0 20px cyan;width:320px;user-select:none;z-index:10}
#ui h1{margin:0 0 20px;font-size:24px;text-align:center;color:cyan}
#ui label{display:block;margin-bottom:8px;font-size:14px}
#myRoomCode{font-weight:700;font-size:20px;color:lime;margin-bottom:10px;user-select:all;cursor:pointer}
#connectId{width:100%;padding:8px;font-size:16px;border-radius:6px;border:none;margin-bottom:15px}
button{width:100%;padding:10px;font-size:16px;border-radius:6px;border:none;background:cyan;color:#000;font-weight:700;cursor:pointer;transition:background .3s}
button:hover{background:#00b3b3}
#statusMsg{margin-top:15px;font-size:14px;text-align:center;color:yellow;min-height:18px}
#respawnOverlay{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);padding:30px 40px;border-radius:12px;font-size:24px;color:#fff;text-align:center;user-select:none;display:none;z-index:20}
#respawnOverlay .deathMsg{margin-bottom:15px;font-weight:700;font-size:20px;color:#f55}
#miniMap{position:fixed;bottom:15px;right:15px;width:200px;height:200px;background:#111;border:2px solid #fff;border-radius:8px;z-index:15}
#hitEffect{pointer-events:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0);z-index:25;transition:background .3s ease-out}
#shieldEffect{pointer-events:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,255,255,0);z-index:24;transition:background .3s ease-out}
#energyBar{position:fixed;top:15px;left:50%;transform:translateX(-50%);width:200px;height:12px;background:rgba(0,0,0,.7);border:2px solid #00ffaa;border-radius:6px;z-index:15;display:none}
#energyFill{height:100%;width:100%;background:linear-gradient(90deg, #00ffaa, #00ccff);border-radius:4px;transition:width .2s}
#energyText{position:fixed;top:30px;left:50%;transform:translateX(-50%);color:#00ffaa;font-size:12px;text-align:center;z-index:15;display:none;text-shadow:0 0 5px #000}
canvas#game{display:block;background:#000}
</style>
</head>
<body>
<div id="ui">
    <h1>Космические корабли</h1>
    <label>Ваш румкод (комната):</label>
    <div id="myRoomCode" title="Нажмите, чтобы скопировать"></div>
    <button id="copyBtn">Скопировать румкод</button>
    <hr style="margin:20px 0;border-color:#444">
    <label for="connectId">Подключиться к румкоду друга:</label>
    <input id="connectId" maxlength="4" placeholder="Введите 4 цифры" autocomplete="off"/>
    <button id="connectBtn">Подключиться</button>
    <div id="statusMsg"></div>
    <div style="margin-top:15px;font-size:12px;color:#555;text-align:center">Версия: 1.1.0 (с трейлами и щитом)</div>
</div>

<div id="respawnOverlay">
    <div class="deathMsg">Ваша дружба с мудасиром окончена,<br>ваш лучший друг теперь салман</div>
    Респавн через <span id="respawnTimer">3</span>...
</div>

<div id="hitEffect"></div>
<div id="shieldEffect"></div>
<div id="energyBar"><div id="energyFill"></div></div>
<div id="energyText">Энергия: 100%</div>

<canvas id="game"></canvas>
<canvas id="miniMap"></canvas>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
const canvas = document.getElementById("game"),
      ctx = canvas.getContext("2d"),
      miniMap = document.getElementById("miniMap"),
      miniCtx = miniMap.getContext("2d"),
      myRoomCodeDiv = document.getElementById("myRoomCode"),
      copyBtn = document.getElementById("copyBtn"),
      connectInput = document.getElementById("connectId"),
      connectBtn = document.getElementById("connectBtn"),
      statusMsg = document.getElementById("statusMsg"),
      respawnOverlay = document.getElementById("respawnOverlay"),
      respawnTimerSpan = document.getElementById("respawnTimer"),
      hitEffect = document.getElementById("hitEffect"),
      shieldEffect = document.getElementById("shieldEffect"),
      energyBar = document.getElementById("energyBar"),
      energyFill = document.getElementById("energyFill"),
      energyText = document.getElementById("energyText");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

miniMap.width = 200;
miniMap.height = 200;

const MAP_WIDTH = 2000,
      MAP_HEIGHT = 2000,
      STAR_COUNT = 200;

let stars = [];
function generateStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
            x: Math.random() * MAP_WIDTH,
            y: Math.random() * MAP_HEIGHT,
            radius: Math.random() * 1.5 + 0.5,
            baseBrightness: Math.random() * 0.8 + 0.2,
            brightness: 0,
            phase: Math.random() * 2 * Math.PI
        });
    }
}
generateStars();

let peer, conn,
    localPlayer = null,
    remotePlayer = null,
    keysPressed = {},
    mousePos = { x: 0, y: 0 },
    mousePressed = false;

class TrailParticle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.life = 1.0;
        this.radius = Math.random() * 4 + 2;
        this.maxLife = Math.random() * 0.5 + 0.5;
    }
    
    update(dt) {
        this.life -= dt / this.maxLife;
        this.radius *= 0.95;
    }
    
    draw(ctx, camera) {
        if (this.life <= 0) return;
        
        const alpha = this.life * 0.7;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class CaptureZone {
    constructor(x, y, r, id) {
        this.x = x;
        this.y = y;
        this.radius = r;
        this.id = id;
        this.capturingPlayerId = null;
        this.captureProgress = 0;
        this.capturingCandidate = null;
    }
    
    update(dt) {
        if (!localPlayer) return;
        
        if (localPlayer.dead) {
            this.capturingCandidate = null;
            this.captureProgress = Math.max(0, this.captureProgress - dt * 0.5);
            return;
        }
        
        const dist = Math.hypot(localPlayer.x - this.x, localPlayer.y - this.y);
        if (dist < this.radius) {
            if (this.capturingCandidate === localPlayer.id || this.capturingCandidate === null) {
                this.capturingCandidate = localPlayer.id;
                if (this.capturingPlayerId !== localPlayer.id) {
                    this.captureProgress += dt * 0.5;
                    if (this.captureProgress >= 1) {
                        this.captureProgress = 1;
                        this.capturingPlayerId = localPlayer.id;
                    }
                }
            } else {
                this.captureProgress = Math.max(0, this.captureProgress - dt * 0.5);
            }
        } else {
            if (this.capturingCandidate === localPlayer.id) this.capturingCandidate = null;
            this.captureProgress = Math.max(0, this.captureProgress - dt * 0.5);
        }
    }
    
    draw(ctx, camera) {
        ctx.save();
        ctx.globalAlpha = 0.2 + 0.4 * this.captureProgress;
        if (this.capturingPlayerId === localPlayer?.id) ctx.fillStyle = "cyan";
        else if (this.capturingPlayerId === remotePlayer?.id) ctx.fillStyle = "orange";
        else ctx.fillStyle = "gray";
        
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, 2 * Math.PI);
        ctx.fill();
        
        ctx.globalAlpha = 1;
        if (this.captureProgress > 0 && this.capturingPlayerId !== localPlayer?.id) {
            const w = 80, h = 6;
            let x = this.x - camera.x - w/2;
            let y = this.y - camera.y + this.radius + 10;
            ctx.fillStyle = "white";
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = "lime";
            ctx.fillRect(x, y, w * this.captureProgress, h);
            ctx.strokeStyle = "black";
            ctx.strokeRect(x, y, w, h);
        }
        ctx.restore();
    }
    
    serialize() {
        return {
            id: this.id,
            capturingPlayerId: this.capturingPlayerId,
            captureProgress: this.captureProgress
        };
    }
    
    deserialize(data) {
        this.capturingPlayerId = data.capturingPlayerId;
        this.captureProgress = data.captureProgress;
    }
}

const captureZones = [
    new CaptureZone(500, 500, 120, "zone1"),
    new CaptureZone(1500, 500, 120, "zone2"),
    new CaptureZone(1000, 1500, 120, "zone3")
];

class Player {
    constructor(id, color) {
        this.id = id;
        this.color = color;
        this.x = Math.random() * MAP_WIDTH;
        this.y = Math.random() * MAP_HEIGHT;
        this.angle = 0;
        this.radius = 20;
        this.bullets = [];
        this.maxHealth = 100;
        this.health = this.maxHealth;
        this.dead = false;
        this.respawnCooldown = 0;
        
        // Трейл-эффекты
        this.trail = [];
        this.trailTimer = 0;
        this.trailInterval = 0.05; // Добавляем частицу каждые 0.05 сек
        
        // Система энергии и щита
        this.maxEnergy = 100;
        this.energy = this.maxEnergy;
        this.energyRegenRate = 15; // ед/сек
        this.shieldActive = false;
        this.shieldEnergyCost = 25; // ед/сек при активации
        this.shieldDamageReduction = 0.7; // 70% снижение урона
        this.shieldRadius = 35;
    }
    
    update(dt) {
        if (this.dead) {
            this.respawnCooldown -= dt;
            if (this === localPlayer) updateRespawnOverlay(this.respawnCooldown);
            if (this.respawnCooldown <= 0) this.respawn();
            return;
        }
        
        // Обновление трейла
        this.trailTimer += dt;
        if (this.trailTimer >= this.trailInterval) {
            this.trailTimer = 0;
            // Добавляем частицу трейла
            const trailX = this.x - Math.cos(this.angle) * 15;
            const trailY = this.y - Math.sin(this.angle) * 15;
            this.trail.push(new TrailParticle(trailX, trailY, this.color));
            
            // Ограничиваем количество частиц
            if (this.trail.length > 15) {
                this.trail.shift();
            }
        }
        
        // Обновление частиц трейла
        for (let i = this.trail.length - 1; i >= 0; i--) {
            this.trail[i].update(dt);
            if (this.trail[i].life <= 0) {
                this.trail.splice(i, 1);
            }
        }
        
        // Управление движением
        let mx = 0, my = 0;
        if (keysPressed.w) my -= 1;
        if (keysPressed.s) my += 1;
        if (keysPressed.a) mx -= 1;
        if (keysPressed.d) mx += 1;
        
        let len = Math.hypot(mx, my);
        if (len > 0) {
            mx /= len;
            my /= len;
        }
        
        const SPEED = 300;
        this.x = Math.min(MAP_WIDTH - this.radius, Math.max(this.radius, this.x + mx * SPEED * dt));
        this.y = Math.min(MAP_HEIGHT - this.radius, Math.max(this.radius, this.y + my * SPEED * dt));
        
        // Обновление угла поворота
        if (localPlayer === this) {
            const dx = mousePos.x + camera.x - this.x,
                  dy = mousePos.y + camera.y - this.y;
            this.angle = Math.atan2(dy, dx);
        }
        
        // Обновление пуль
        this.bullets.forEach(b => b.update(dt));
        this.bullets = this.bullets.filter(b => !b.destroyed);
        
        // Обновление энергии и щита
        if (this === localPlayer) {
            if (this.shieldActive && mousePressed) {
                // Активно используем щит - тратим энергию
                this.energy -= this.shieldEnergyCost * dt;
                if (this.energy <= 0) {
                    this.energy = 0;
                    this.shieldActive = false;
                    hideShieldEffect();
                }
            } else {
                // Регенерация энергии
                this.energy += this.energyRegenRate * dt;
                if (this.energy > this.maxEnergy) {
                    this.energy = this.maxEnergy;
                }
            }
            
            // Обновление UI энергии
            updateEnergyUI(this.energy / this.maxEnergy);
        }
    }
    
    draw(ctx, camera) {
        // Рисуем трейл
        this.trail.forEach(particle => particle.draw(ctx, camera));
        
        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y);
        ctx.rotate(this.angle);
        
        if (this.dead) ctx.globalAlpha = 0.4;
        
        // Рисуем корабль
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 20;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(20, 0);
        ctx.lineTo(-15, 12);
        ctx.lineTo(-15, -12);
        ctx.closePath();
        ctx.fill();
        
        ctx.globalAlpha = 1;
        ctx.restore();
        
        // Рисуем щит если активен
        if (this.shieldActive) {
            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 3;
            ctx.shadowColor = "#00ffff";
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(this.x - camera.x, this.y - camera.y, this.shieldRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        
        // Рисуем пули
        this.bullets.forEach(b => b.draw(ctx, camera));
        
        // Рисуем полосу здоровья
        const w = 40, h = 6,
              x = this.x - camera.x - w/2,
              y = this.y - camera.y - this.radius - 15;
        ctx.fillStyle = "gray";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "lime";
        ctx.fillRect(x, y, w * (this.health / this.maxHealth), h);
        ctx.strokeStyle = "black";
        ctx.strokeRect(x, y, w, h);
    }
    
    shoot() {
        if (this.dead || (this.shieldActive && mousePressed)) return;
        const speed = 600,
              bx = this.x + Math.cos(this.angle) * 25,
              by = this.y + Math.sin(this.angle) * 25;
        this.bullets.push(new Bullet(bx, by, this.angle, speed, this.color, this.id));
    }
    
    takeDamage(amount) {
        if (this.dead) return;
        
        // Если щит активен - уменьшаем урон
        let finalDamage = amount;
        if (this.shieldActive && mousePressed) {
            finalDamage = amount * (1 - this.shieldDamageReduction);
            // Дополнительная трата энергии при блокировании урона
            this.energy -= amount * 5;
            if (this.energy < 0) {
                this.energy = 0;
                this.shieldActive = false;
                hideShieldEffect();
            }
        }
        
        this.health -= finalDamage;
        if (this === localPlayer) showHitEffect();
        
        if (this.health <= 0) {
            this.health = 0;
            this.dead = true;
            this.respawnCooldown = 3;
            if (this === localPlayer) showRespawnOverlay();
        }
    }
    
    toggleShield(active) {
        if (this.dead || this.energy <= 0) {
            this.shieldActive = false;
            return;
        }
        
        this.shieldActive = active;
        if (this === localPlayer) {
            if (active && this.energy > 0) {
                showShieldEffect();
            } else {
                hideShieldEffect();
            }
        }
    }
    
    respawn() {
        this.x = Math.random() * (MAP_WIDTH - 2 * this.radius) + this.radius;
        this.y = Math.random() * (MAP_HEIGHT - 2 * this.radius) + this.radius;
        this.health = this.maxHealth;
        this.energy = this.maxEnergy;
        this.dead = false;
        this.shieldActive = false;
        this.trail = [];
        if (this === localPlayer) {
            hideRespawnOverlay();
            hideShieldEffect();
        }
    }
}

class Bullet {
    constructor(x, y, a, s, c, o) {
        this.x = x;
        this.y = y;
        this.angle = a;
        this.speed = s;
        this.color = c;
        this.destroyed = false;
        this.ownerId = o;
        this.radius = 5;
    }
    
    update(dt) {
        this.x += Math.cos(this.angle) * this.speed * dt;
        this.y += Math.sin(this.angle) * this.speed * dt;
        if (this.x < 0 || this.x > MAP_WIDTH || this.y < 0 || this.y > MAP_HEIGHT) {
            this.destroyed = true;
        }
    }
    
    draw(ctx, camera) {
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, 2 * Math.PI);
        ctx.fill();
    }
}

let camera = { x: 0, y: 0 };

function generateRoomCode() {
    return (Math.floor(1000 + Math.random() * 9000)).toString();
}

function isValidRoomCode(c) {
    return /^\d{4}$/.test(c);
}

let myRoomCode = generateRoomCode();
myRoomCodeDiv.textContent = myRoomCode;

copyBtn.onclick = () => {
    navigator.clipboard.writeText(myRoomCode).then(() => {
        alert("Румкод скопирован в буфер обмена!");
    });
};

connectBtn.onclick = () => {
    const r = connectInput.value.trim();
    if (!isValidRoomCode(r)) {
        statusMsg.textContent = "Введите корректный 4-значный румкод!";
        return;
    }
    if (r === myRoomCode) {
        statusMsg.textContent = "Нельзя подключаться к своему румкоду!";
        return;
    }
    statusMsg.textContent = "Подключение...";
    connectToPeer(r);
};

function createPeer() {
    peer = new Peer(myRoomCode, {
        config: {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "turn:turn.anyfirewall.com:443?transport=tcp", username: "webrtc", credential: "webrtc" }
            ]
        }
    });
    
    peer.on("open", id => {
        console.log("Peer открыт с ID:", id);
        localPlayer = new Player(id, "cyan");
        remotePlayer = new Player(null, "orange");
    });
    
    peer.on("connection", connection => {
        if (conn) {
            connection.close();
            return;
        }
        conn = connection;
        setupConnection();
    });
    
    peer.on("error", e => {
        console.error("Peer error:", e);
        statusMsg.textContent = "Ошибка Peer: " + e;
    });
}

function connectToPeer(id) {
    if (conn) {
        conn.close();
        conn = null;
    }
    if (!peer || peer.disconnected) {
        statusMsg.textContent = "Peer не готов. Перезагрузите страницу.";
        return;
    }
    conn = peer.connect(id);
    setupConnection();
}

function setupConnection() {
    conn.on("open", () => {
        console.log("Соединение открыто");
        statusMsg.textContent = "Соединение установлено!";
        document.getElementById("ui").style.display = "none";
        energyBar.style.display = "block";
        energyText.style.display = "block";
    });
    
    conn.on("data", handleData);
    conn.on("close", () => {
        console.log("Соединение закрыто");
        statusMsg.textContent = "Соединение закрыто.";
        document.getElementById("ui").style.display = "block";
        energyBar.style.display = "none";
        energyText.style.display = "none";
        conn = null;
    });
    
    conn.on("error", e => {
        console.error("Ошибка соединения:", e);
        statusMsg.textContent = "Ошибка соединения: " + e;
    });
}

function sendData() {
    if (conn && conn.open && localPlayer) {
        conn.send({
            player: {
                x: localPlayer.x,
                y: localPlayer.y,
                angle: localPlayer.angle,
                health: localPlayer.health,
                dead: localPlayer.dead,
                id: localPlayer.id,
                energy: localPlayer.energy,
                shieldActive: localPlayer.shieldActive
            },
            bullets: localPlayer.bullets.map(b => ({
                x: b.x,
                y: b.y,
                angle: b.angle,
                ownerId: b.ownerId
            })),
            captureZones: captureZones.map(z => z.serialize())
        });
    }
}

function handleData(d) {
    if (!remotePlayer) return;
    
    if (d.player) {
        remotePlayer.id = d.player.id;
        remotePlayer.x = d.player.x;
        remotePlayer.y = d.player.y;
        remotePlayer.angle = d.player.angle;
        remotePlayer.health = d.player.health;
        remotePlayer.dead = d.player.dead;
        remotePlayer.energy = d.player.energy;
        remotePlayer.shieldActive = d.player.shieldActive;
    }
    
    if (d.bullets) {
        remotePlayer.bullets = d.bullets.map(b => 
            new Bullet(b.x, b.y, b.angle, 600, "orange", b.ownerId)
        );
    }
    
    if (d.captureZones) {
        d.captureZones.forEach(zd => {
            const z = captureZones.find(z => z.id === zd.id);
            if (z) z.deserialize(zd);
        });
    }
}

let lastTime = 0;

function update(t = 0) {
    const dt = (t - lastTime) / 1000;
    lastTime = t;
    
    if (localPlayer) localPlayer.update(dt);
    if (remotePlayer) remotePlayer.update(dt);
    
    captureZones.forEach(z => z.update(dt));
    
    // Проверка столкновений пуль
    if (localPlayer && remotePlayer) {
        localPlayer.bullets.forEach(b => {
            if (!b.destroyed && !remotePlayer.dead) {
                const dist = Math.hypot(b.x - remotePlayer.x, b.y - remotePlayer.y);
                if (dist < remotePlayer.radius + b.radius) {
                    b.destroyed = true;
                    remotePlayer.takeDamage(20);
                }
            }
        });
        
        remotePlayer.bullets.forEach(b => {
            if (!b.destroyed && !localPlayer.dead) {
                const dist = Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y);
                if (dist < localPlayer.radius + b.radius) {
                    b.destroyed = true;
                    localPlayer.takeDamage(20);
                }
            }
        });
    }
    
    // Обновление камеры
    if (localPlayer) {
        const tx = localPlayer.x - canvas.width / 2,
              ty = localPlayer.y - canvas.height / 2;
        camera.x += 0.1 * (tx - camera.x);
        camera.y += 0.1 * (ty - camera.y);
    }
    
    sendData();
    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Рисуем звёзды
    const time = Date.now() / 1000;
    stars.forEach(s => {
        s.brightness = s.baseBrightness + Math.sin(time * 3 + s.phase) * 0.3;
        ctx.fillStyle = `rgba(255,255,255,${s.brightness.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(s.x - camera.x, s.y - camera.y, s.radius, 0, 2 * Math.PI);
        ctx.fill();
    });
    
    // Рисуем зоны захвата
    captureZones.forEach(z => z.draw(ctx, camera));
    
    // Рисуем игроков
    remotePlayer && remotePlayer.draw(ctx, camera);
    localPlayer && localPlayer.draw(ctx, camera);
    
    drawMiniMap();
}

function drawMiniMap() {
    miniCtx.clearRect(0, 0, miniMap.width, miniMap.height);
    
    // Звёзды на мини-карте
    stars.forEach(s => {
        miniCtx.fillStyle = "white";
        miniCtx.beginPath();
        miniCtx.arc((s.x / MAP_WIDTH) * miniMap.width, (s.y / MAP_HEIGHT) * miniMap.height, 1, 0, 2 * Math.PI);
        miniCtx.fill();
    });
    
    // Зоны захвата на мини-карте
    captureZones.forEach(z => {
        miniCtx.fillStyle = (z.capturingPlayerId === localPlayer?.id) ? "cyan" :
                           (z.capturingPlayerId === remotePlayer?.id) ? "orange" : "gray";
        miniCtx.globalAlpha = 0.5 + 0.5 * z.captureProgress;
        miniCtx.beginPath();
        miniCtx.arc((z.x / MAP_WIDTH) * miniMap.width, (z.y / MAP_HEIGHT) * miniMap.height, z.radius / 10, 0, 2 * Math.PI);
        miniCtx.fill();
        miniCtx.globalAlpha = 1;
    });
    
    // Игроки на мини-карте
    if (localPlayer) {
        miniCtx.fillStyle = "cyan";
        miniCtx.beginPath();
        miniCtx.arc((localPlayer.x / MAP_WIDTH) * miniMap.width, (localPlayer.y / MAP_HEIGHT) * miniMap.height, 5, 0, 2 * Math.PI);
        miniCtx.fill();
    }
    
    if (remotePlayer) {
        miniCtx.fillStyle = "orange";
        miniCtx.beginPath();
        miniCtx.arc((remotePlayer.x / MAP_WIDTH) * miniMap.width, (remotePlayer.y / MAP_HEIGHT) * miniMap.height, 5, 0, 2 * Math.PI);
        miniCtx.fill();
    }
}

// Управление
window.addEventListener("keydown", e => {
    keysPressed[e.key.toLowerCase()] = true;
    if (e.key === " " && localPlayer && !localPlayer.dead) {
        localPlayer.shoot();
    }
});

window.addEventListener("keyup", e => {
    keysPressed[e.key.toLowerCase()] = false;
});

window.addEventListener("mousemove", e => {
    mousePos.x = e.clientX;
    mousePos.y = e.clientY;
});

window.addEventListener("mousedown", e => {
    mousePressed = true;
    if (localPlayer && !localPlayer.dead && localPlayer.energy > 0) {
        localPlayer.toggleShield(true);
    }
});

window.addEventListener("mouseup", e => {
    mousePressed = false;
    if (localPlayer) {
        localPlayer.toggleShield(false);
    }
});

// Эффекты
function showHitEffect() {
    hitEffect.style.background = "rgba(255,0,0,.3)";
    setTimeout(() => {
        hitEffect.style.background = "rgba(255,0,0,0)";
    }, 100);
}

function showShieldEffect() {
    shieldEffect.style.background = "rgba(0,255,255,.1)";
}

function hideShieldEffect() {
    shieldEffect.style.background = "rgba(0,255,255,0)";
}

function updateEnergyUI(percentage) {
    const percent = Math.max(0, Math.min(100, Math.round(percentage * 100)));
    energyFill.style.width = `${percent}%`;
    energyText.textContent = `Энергия: ${percent}%`;
    
    // Меняем цвет при низкой энергии
    if (percent < 30) {
        energyFill.style.background = "linear-gradient(90deg, #ff4444, #ffaa00)";
        energyText.style.color = "#ff4444";
    } else if (percent < 60) {
        energyFill.style.background = "linear-gradient(90deg, #ffaa00, #ffff00)";
        energyText.style.color = "#ffff00";
    } else {
        energyFill.style.background = "linear-gradient(90deg, #00ffaa, #00ccff)";
        energyText.style.color = "#00ffaa";
    }
}

function showRespawnOverlay() {
    respawnOverlay.style.display = "block";
    respawnTimerSpan.textContent = "3";
    energyBar.style.display = "none";
    energyText.style.display = "none";
}

function updateRespawnOverlay(t) {
    respawnTimerSpan.textContent = t > 0 ? Math.ceil(t).toString() : "0";
}

function hideRespawnOverlay() {
    respawnOverlay.style.display = "none";
    energyBar.style.display = "block";
    energyText.style.display = "block";
}

// Запуск игры
createPeer();
requestAnimationFrame(update);
</script>
</body>
</html>
